{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <title> Log In </title>
</head>
<body>
    <main>
        <div class="auth-container">
            <img class = "form-logo" src = "{% static 'img/logo2.png' %}" alt = "logo">
            <div class = "page-title"> Log In </div>
            <form class ="login-form" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log in</button>
            </form>
            <p class = "auth-switch"> Dont have an account? <a href ="{% url 'signup' %}"> Sign Up </a></p>
        </div>
    </main>    
</body>
</html>
